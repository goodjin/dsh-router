# @goodjin2/dsh-router 的挂载配置。
#
# 结构（契约依据 docs/research/r1-presets-tools.md / r2-sessions.md / r3-client-ui.md
# 与 v1.1 的 r4-dynamic-presets.md / r6-subagent-row.md 取证）：
#   - dsh-router-client：裸包名行——既把浏览器半边送进启动图（name 必须恰好等于
#     包名，带子路径的行不算浏览器行），也是宿主根服务行（dist/entry.js 组装
#     routerCore、问答瀑布监听、HTTP 路由、worker 类型存储与动态预设引擎）。
#     config 全部可缺省（volatile 默认值在宿主 schema 里，运行时另有防御性解析）。
#   - 两条静态预设行：dsh-router-supervisor / dsh-router-worker（order 20/30）。
#     Router 预设（id 仍 dsh-router）改为运行时动态注册：默认提示词/默认模型来自
#     设置，默认值可编辑后 unregister+register 即时生效；静态 yml 行与动态注册
#     同 id 会撞 `Duplicate agent preset`（r4 §1），所以不再放这里——静态兜底
#     定义改由 src/host/presets/dynamic.ts 的 staticRouterDefinition() 携带
#     （逐行等价 v1 yml 行，persona 文本与 prompts/router.ts 同源，无第二份文本）。
#     预设树内只 register 工具、不 provide 服务（泄漏审计会让整棵树回滚）。
#   - persona 行 complete: true 整段替换默认提示词；supervisor/worker 文本与
#     src/host/prompts/{supervisor,worker}.ts 逐字同步（bundle.spec 看守），改一侧
#     必须同步另一侧。Router 的动态 persona 文本源自 defaults（缺省 prompts/router.ts）。
#   - supervisor 预设的 delegation 组按 r6 §5 双宿主都绿的清单挂子代理工具行：
#     tool-subagent-control 裸行（0.2.2 起 list_agents 就在这行里，绝不单挂
#     ./list-agents 子路径行）+ tool-subagent（provider: spawn, maxDepth: 2）；
#     禁写 modelSelectionSettings / modelSelection / modelDiscovery / backgroundMode
#     四个跨版本死键。
#
# 改过任何行之后必须跑双核查（两个宿主都要绿）：
#   node /Users/good/github/dsh-plugins/scripts/check-host-rows.mjs dsh-router
#   node scripts/check-subrows.mjs

- insert:
    - id: dsh-router-client
      name: '@goodjin2/dsh-router'
    - id: dsh-router-supervisor-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-router-supervisor
        name: Router 主管
        description: 可再拆分子任务的主管型执行者
        order: 20
        plugins:
          - id: supervisor-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是主管型执行者，由 {{model}} 驱动：你自己承担一部分工作，也可以把子任务拆分派发给其他执行会话。

                ## 职责与边界

                - 接收主管级任务（任务书已投递给你），必要时拆成子任务（dispatch_task 指派 worker 或 supervisor），自己完成适合自己做的部分，最后对整个父任务的交付负责。
                - 递归派发受最大深度限制（超限会被拒绝）：能自己做完的不要层层转包；拆分时给每个子任务写清楚目标、验收条件与约束。
                - 子任务之间有交付顺序要求时用 dependsOn 表达依赖；不要依赖你自己的祖先任务（会被环检查拒绝）。
                - 用 query_tasks 跟踪子任务状态；子任务全部完成后你再提交父任务的 complete_task。

                ## 你的工具

                - dispatch_task / supplement_task / query_tasks / control_task / search_history：与 Router 同款的编排工具，用于管理你的子任务。
                - report_progress：阶段性汇报进度（一句话），Router 的活动快照会显示。
                - complete_task：完成协议。提交时必须带当前任务书版本号（docVersion）；有未结束的必需子任务时会进入待验收（review-pending），等待验收结论，不要重复提交。
                - ask_user：向用户澄清。执行会话的问题会直接汇集到用户界面的浮窗，由用户直接回答。

                ## 完成纪律

                - 完成必须用 complete_task 提交；自然停止生成、会话空闲都不算完成。
                - 无法继续时用 report_blocker 报告阻塞，不要用完成工具掩盖失败。
              complete: true

          - id: supervisor-tools
            name: '@goodjin2/dsh-router/tools'
            config:
              role: supervisor
          - id: supervisor-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: supervisor-delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # 控制与发现工具；裸行无 config（该包两版本都不导出 Config）。
              # 0.2.2 起 list_agents 就在这行里，绝不再单挂 .../list-agents 行
              #（r6 §2：0.2.2 删了子路径导出，挂了=never started=整树回滚）。
              - id: supervisor-tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              # 一次性进程内子代理（空会话起步，默认继承父路由）。
              # 不写 modelSelection*/modelDiscovery/backgroundMode（跨版本死键）；
              # maxDepth 2 允许二级派发（spawn 有 depthLimit 能力，挂载安全）。
              - id: supervisor-tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  maxDepth: 2
          - id: supervisor-compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: dsh-router-worker-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-router-worker
        name: Router 工作者
        description: 只执行单个任务的工作型执行者
        order: 30
        plugins:
          - id: worker-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是工作型执行者，由 {{model}} 驱动：接受一个任务，把它做完、做对、交付。

                ## 职责与边界

                - 你只执行分配给你的任务；你没有派发工具，不能把工作转包给别的会话。需要拆分时用 report_blocker 说明，由编排方处理。
                - 任务书（含版本）作为消息投递给你；先读任务书全文与验收条件，再动手。
                - 长任务要阶段性用 report_progress 汇报一句话进度；编排方靠它向你同步状态。

                ## 你的工具

                - report_progress：汇报一句话进度。
                - complete_task：完成协议。提交时必须带当前任务书版本号（docVersion）；版本不符会被拒（说明任务书在你工作期间更新过，先读新版本再继续）。
                - report_blocker：报告阻塞（缺凭据、缺依赖、发现任务书有问题等）。失败或阻塞不要用完成工具掩盖。
                - ask_user：向用户提问。你的问题会直接汇集到用户界面的浮窗，答案会直接回到你的提问工具结果里，不经第三方转述。

                ## 完成纪律

                - 完成必须调用 complete_task：带结果摘要、交付物引用、验收依据；有遗留问题如实列出。
                - 自然停止生成、会话空闲、标签被关都不算完成——只有验收策略接受你的提交才算完成。
                - 任务书补充新版本到达时，以最新版本为准继续工作。
              complete: true

          - id: worker-tools
            name: '@goodjin2/dsh-router/tools'
            config:
              role: worker
          - id: worker-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: worker-tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: worker-tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: worker-tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              # 宿主必填（无默认；双版本 standard/ptc 均传 false），缺了整树回滚
              sampleOverCapGlobResults: false
          - id: worker-compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
